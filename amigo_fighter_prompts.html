<meta charset="UTF-8">

<title>Amigo Fighter — Prompts</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --red:#e63946;--dark:#0d0d0f;--dark2:#141418;--dark3:#1c1c22;
  --light:#f0ece4;--muted:rgba(240,236,228,0.5);--border:rgba(240,236,228,0.1);
  --ninja:#7c3aed;--agresivo:#dc2626;--campeon:#d97706;--clasico:#2563eb;
}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--light);min-height:100vh;}

/* TOP BAR */
header{position:sticky;top:0;z-index:100;background:rgba(13,13,15,0.95);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:var(--red);}
.total-badge{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--border);padding:4px 12px;border-radius:20px;}
.copied-toast{position:fixed;bottom:24px;right:24px;background:var(--red);color:#fff;
  padding:12px 24px;border-radius:8px;font-size:13px;font-weight:500;letter-spacing:1px;
  opacity:0;transform:translateY(10px);transition:all .3s;z-index:999;pointer-events:none;}
.copied-toast.show{opacity:1;transform:translateY(0);}

/* CHARACTER TABS */
.char-tabs{display:flex;gap:2px;padding:16px 24px 0;border-bottom:1px solid var(--border);
  background:var(--dark2);overflow-x:auto;}
.char-tab{padding:10px 24px;font-size:13px;font-weight:500;letter-spacing:1px;cursor:pointer;
  border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:none;
  transition:all .2s;white-space:nowrap;color:var(--muted);}
.char-tab:hover{color:var(--light);background:rgba(255,255,255,0.05);}
.char-tab.active{color:#fff;border-color:var(--border);}
.char-tab[data-char="ninja"].active{background:rgba(124,58,237,0.2);border-color:#7c3aed;color:#a78bfa;}
.char-tab[data-char="agresivo"].active{background:rgba(220,38,38,0.2);border-color:#dc2626;color:#fca5a5;}
.char-tab[data-char="campeon"].active{background:rgba(217,119,6,0.2);border-color:#d97706;color:#fcd34d;}
.char-tab[data-char="clasico"].active{background:rgba(37,99,235,0.2);border-color:#2563eb;color:#93c5fd;}

/* MAIN LAYOUT */
.main{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 110px);}

/* SIDEBAR */
.sidebar{background:var(--dark2);border-right:1px solid var(--border);padding:16px 0;
  position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;}
.anim-group{cursor:pointer;padding:10px 20px;font-size:12px;letter-spacing:2px;
  text-transform:uppercase;color:var(--muted);transition:all .2s;display:flex;
  align-items:center;justify-content:space-between;}
.anim-group:hover{color:var(--light);background:rgba(255,255,255,0.04);}
.anim-group.active{color:#fff;font-weight:500;}
.anim-group .count{font-size:10px;background:rgba(255,255,255,0.08);
  padding:2px 7px;border-radius:10px;}
.char-tab[data-char="ninja"] ~ .anim-group.active,.sidebar[data-char="ninja"] .anim-group.active{color:#a78bfa;}
.sidebar-title{font-size:10px;letter-spacing:3px;text-transform:uppercase;
  color:rgba(240,236,228,0.2);padding:8px 20px 4px;margin-top:8px;}

/* CONTENT */
.content{padding:24px;overflow-y:auto;}
.anim-section{display:none;}
.anim-section.active{display:block;}
.section-header{margin-bottom:20px;}
.section-header h2{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;margin-bottom:4px;}
.section-header p{font-size:13px;color:var(--muted);}

.frames-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px;}

.frame-card{background:var(--dark2);border:1px solid var(--border);border-radius:10px;overflow:hidden;
  transition:border-color .2s;}
.frame-card:hover{border-color:rgba(240,236,228,0.25);}
.frame-header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);}
.frame-num{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;}
.frame-name{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.copy-btn{padding:5px 14px;border-radius:6px;border:1px solid var(--border);background:transparent;
  color:var(--muted);font-size:11px;letter-spacing:1px;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;}
.copy-btn:hover{background:var(--red);border-color:var(--red);color:#fff;}
.copy-btn:active{transform:scale(.95);}
.frame-body{padding:14px 16px;}
.prompt-text{font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;
  color:rgba(240,236,228,0.85);white-space:pre-wrap;word-break:break-word;}
.highlight{color:#fbbf24;}
.highlight-red{color:#f87171;}
.filename{font-size:10px;letter-spacing:1px;color:rgba(240,236,228,0.3);margin-top:10px;
  font-family:'JetBrains Mono',monospace;}

/* Color accents per char */
[data-active-char="ninja"] .frame-header{border-bottom-color:rgba(124,58,237,0.3);}
[data-active-char="ninja"] .frame-num{color:#a78bfa;}
[data-active-char="agresivo"] .frame-num{color:#fca5a5;}
[data-active-char="campeon"] .frame-num{color:#fcd34d;}
[data-active-char="clasico"] .frame-num{color:#93c5fd;}

@media(max-width:768px){
  .main{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;display:flex;overflow-x:auto;padding:8px 0;
    border-right:none;border-bottom:1px solid var(--border);}
  .anim-group{white-space:nowrap;padding:8px 14px;}
  .sidebar-title{display:none;}
  .frames-grid{grid-template-columns:1fr;}
}

const SUFFIX = `

**MANDATORY HEAD RULE:**
The head in this frame MUST be a perfectly smooth solid white oval/ellipse with a small gray + crosshair in the center. No face, no hair, no skin, no expression on the head area. Only a clean white oval. Non-negotiable.

**MANDATORY BACKGROUND — CHROMA KEY GREEN:**
The background MUST be a SOLID FLAT #00FF00 (pure neon green chroma key). NO gradients, NO textures, NO shadows on the floor, NO lighting effects on the background. Just perfectly flat #00FF00. Required for automatic background removal in the game engine.

**MANDATORY ANCHOR:**
Character's foot/feet at Y=180 (10px from bottom of 192px canvas).`

const CHARS = ['ninja','agresivo','campeon','clasico'];
const ANIM_KEYS = ['idle','walk','jump','jab','hook','kick','hit','special','block','ko'];

let activeChar = 'ninja';
let activeAnim = 'idle';

function buildPrompt(char, anim, frameIdx) {
  const b = BASE[char];
  const a = ANIMS[anim];
  const frameText = a[char][frameIdx];
  return `Act as an expert pixel art animator for a 2D fighting game called "Amigo Fighter".
Generate a SINGLE animation frame for the character "${b.label}".

**TECHNICAL SPECS:**
- Canvas: 128x192 pixels (high-res option: 256x384 — same proportion)
- Background: SOLID FLAT #00FF00 chroma key green (NOT transparent, NOT gradient, just flat #00FF00)
- Character faces RIGHT
- Foot anchor: feet always at Y=180 (10px from bottom edge)
- Style: pixel art, cel-shaded, hard crisp edges, NO anti-aliasing on character borders
- No background elements, no floor shadows, no environment

**CHARACTER:**
${b.desc}
Stance: ${b.stance}
Colors: ${b.palette}
Special FX: ${b.special_fx}

**THIS SPECIFIC FRAME:**
${frameText}${SUFFIX}`;
}

function renderContent() {
  const a = ANIMS[activeAnim];
  const b = BASE[activeChar];
  const frames = Array.from({length: a.frames}, (_,i) => i);

  document.getElementById('content').innerHTML = `
    <div class="anim-section active">
      <div class="section-header">
        <h2 style="color:${b.color}">${a.label}</h2>
        <p>${a.desc} — ${a.frames} frames para ${b.label}</p>
      </div>
      <div class="frames-grid">
        ${frames.map(i => `
          <div class="frame-card">
            <div class="frame-header">
              <div>
                <div class="frame-num" style="color:${b.color}">Frame ${i+1} / ${a.frames}</div>
                <div class="frame-name">${activeChar}_${activeAnim}_${i+1}.png</div>
              </div>
              <button class="copy-btn" onclick="copyPrompt('${activeChar}','${activeAnim}',${i})">Copiar</button>
            </div>
            <div class="frame-body">
              <div class="prompt-text">${escHtml(buildPrompt(activeChar, activeAnim, i))}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function copyPrompt(char, anim, frameIdx) {
  const text = buildPrompt(char, anim, frameIdx);
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  });
}

function setChar(char) {
  activeChar = char;
  document.querySelectorAll('.char-tab').forEach(t => t.classList.toggle('active', t.dataset.char === char));
  document.getElementById('mainLayout').dataset.activeChar = char;
  renderContent();
}

function setAnim(anim) {
  activeAnim = anim;
  document.querySelectorAll('.anim-group').forEach(t => t.classList.toggle('active', t.dataset.anim === anim));
  renderContent();
}

document.querySelectorAll('.char-tab').forEach(t => t.addEventListener('click', () => setChar(t.dataset.char)));
document.querySelectorAll('.anim-group').forEach(t => t.addEventListener('click', () => setAnim(t.dataset.anim)));

renderContent();
</script>
